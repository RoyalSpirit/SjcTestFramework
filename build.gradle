plugins {
    id 'java'
    id 'io.qameta.allure' version '2.9.6'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

def cucumberVersion = '7.14.0'
def selenideVersion = '7.16.0'
def junitVersion = '5.11.3'
def restAssuredVersion = '5.5.7'
def groovyVersion = '4.0.22'

def allureVersion = '2.35.1'
def aspectJVersion = '1.9.22'

dependencies {

    // Core dependencies
    implementation "com.codeborne:selenide:$selenideVersion"
    implementation "org.reflections:reflections:0.10.2"
    testImplementation "io.cucumber:cucumber-java:$cucumberVersion"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:$cucumberVersion"
    testImplementation "org.junit.platform:junit-platform-suite:1.10.2"
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testImplementation "io.rest-assured:rest-assured:$restAssuredVersion"
    testImplementation "org.apache.groovy:groovy-json:$groovyVersion"
    // Overrides vulnerable transitive dependencies from RestAssured
    testImplementation "org.apache.httpcomponents:httpclient:4.5.14"
    testImplementation "org.apache.httpcomponents:httpmime:4.5.14"
    testImplementation "commons-codec:commons-codec:1.22.0"

    // Additional dependencies
    testImplementation "io.qameta.allure:allure-cucumber7-jvm"
    testImplementation "ch.qos.logback:logback-classic:1.5.33"

    // Allure report dependencies
    agent "org.aspectj:aspectjweaver:$aspectJVersion"
    testImplementation platform("io.qameta.allure:allure-bom:$allureVersion")
    testImplementation ("io.qameta.allure:allure-selenide:$allureVersion")
    testImplementation "io.qameta.allure:allure-junit5"
    testImplementation "io.qameta.allure:allure-rest-assured"
    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
}

def forwardedTestSystemProperties = [
        'starting.url',
        'browser.name',
        'browser.size',
        'browser.version',
        'browser.headless',
        'path.to.webdriver',
        'logs.color.enabled',
        'api.base.url',
        'cucumber.filter.tags'
]

test {
    useJUnitPlatform()

    forwardedTestSystemProperties.each { propertyName ->
        def propertyValue = System.getProperty(propertyName)
        if (propertyValue != null) {
            systemProperty propertyName, propertyValue
        }
    }

    jvmArgs = [ "-javaagent:${configurations.agent.singleFile}" ]
}
